version: 2

models:
  - name: fct_orders
    description: "Order fact table (grain: one order). Net revenue = paid - refunds."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: mart_daily_revenue
    description: "Daily KPIs per country for dashboards."
